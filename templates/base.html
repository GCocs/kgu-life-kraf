<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/static/img/favicon.ico" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />

    <!-- <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script> -->

    <title>{% block title %}크구라이프{% endblock %}</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav
      class="navbar navbar-expand-lg navbar-light"
      style="background-color: #ffffff"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <img
            src="{{ url_for('static', filename='/img/KRAFTON_Black.png') }}"
            alt="KRAF 로고"
            width="100"
            height="25"
            class="d-inline-block align-top"
          />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#navbarText"
          aria-controls="navbarText"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse container-fluid" id="navbarText">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a
                class="nav-link h6 mx-3 {% if current_path == '/' %}active{% endif %}"
                href="/"
                >홈</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link h6 mx-3 {% if current_path == '/map' %}active{% endif %}"
                href="/map"
                >지도</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link h6 mx-3 {% if current_path == '/school' %}active{% endif %}"
                href="/school"
                >학교생활</a
              >
            </li>
          </ul>
          {% if logined_email %}
          <span class="navbar-text mr-3"></span>
          
          <!-- 드롭다운 버튼 -->
          <div class="nav-item dropdown">
            <button class="btn btn-info dropdown-toggle custom-rounded custom-btn" data-toggle="dropdown" aria-expanded="false">
              {{ logined_email }}
            </button>

            <!-- 드롭다운 메뉴 -->
            <ul class="dropdown-menu dropdown-menu-right w-100 p-0 rounded">
              <li>
                <button class="dropdown-item text-center py-2 custom-rounded" onclick="logout()">로그아웃</button>
              </li>
            </ul>
          </div>
          
          
          {% else %}
          <!-- 로그인 버튼 -->
          <button type="button" class="btn btn-info ml-3 custom-rounded custom-btn" onclick="location.href='/login'">
            로그인
          </button>
          {% endif %}
          
          
        </div>
      </div>
    </nav>

    <main class="flex-grow-1">
      <div class="container mt-30">{% block content %}{% endblock %}</div>
    </main>

    <footer class="mt-auto py-3">
      <div class="container">
        <hr />
        <div style="font-size: small; text-align: center">
          <p class="text-muted mt-30">
            <span>
              김하린. leanonaz@gmail.com 윤서준. ysh062100@gmail.com 이영선.
              e0sunee882@gmail.com<br />
              Copyright 2025. All Rights Reserved.
            </span>
          </p>
        </div>
      </div>
    </footer>

    <!--JavaScript Libraries-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!--Templates JavaScript-->
    <script src="{{ url_for('static', filename='js/account.js') }}"></script>

  </body>
</html>
